name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Examples behave as the contract says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  action:
    name: The action passes a valid release and fails an invalid one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          path: examples/valid/laravel-nginx examples/valid/javascript-node examples/valid/python-asgi
      - id: invalid
        uses: ./
        continue-on-error: true
        with:
          path: examples/invalid/folder-archive-changed
      - name: The invalid release failed
        run: test "${{ steps.invalid.outcome }}" = "failure"
