name: shop
services:
  app:
    volumes: []
    ports: []
    networks:
      - ship
    env_file:
      -
        path: .env
        required: false
    extra_hosts: []
    command:
      - sh
      - '-c'
      - 'php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000'
    environment:
      SHIP_RUN_AS: www-data
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-app}'
      DB_USERNAME: '${DB_USERNAME:-app}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      OCTANE_SERVER: swoole
    restart: unless-stopped
    image: 'shop-app:1.0.0'
  mysql:
    image: 'mysql:9.7@sha256:be3fbdfb68760d0f1bfbdbd7ac58154192cfcd5a2b008c9c52ccade88f0757d8'
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-app}'
      MYSQL_USER: '${DB_USERNAME:-app}'
      MYSQL_PASSWORD: '${DB_PASSWORD:?set a real value in .env.production}'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?set a real value in .env.production}'
    volumes:
      - 'ship-mysql-data:/var/lib/mysql'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ship
    restart: unless-stopped
    ports: []
networks:
  ship:
    driver: bridge
volumes:
  ship-mysql-data: null
