name: Check a ship release
description: Checks a Ship release folder (or release.json) against the ship-release contract and its JSON Schema.
inputs:
  path:
    description: The release folder (dist/ship/<tag>) or a release.json. Several may be given, separated by spaces.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - name: Install the checker
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
    - name: Check the release
      shell: bash
      run: node "$GITHUB_ACTION_PATH/tools/check-release.mjs" ${{ inputs.path }}
